<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fraction Calculator</title>
<meta name="description" content="A student calculator with exact fractions, order-of-operations steps, and fully remappable keyboard shortcuts.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a4bb8'/%3E%3Ctext x='16' y='14' font-family='sans-serif' font-size='11' font-weight='700' fill='white' text-anchor='middle'%3E1%3C/text%3E%3Crect x='9' y='16' width='14' height='2' fill='white'/%3E%3Ctext x='16' y='28' font-family='sans-serif' font-size='11' font-weight='700' fill='white' text-anchor='middle'%3E2%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg: #f3f1ea;
  --panel: #fffefa;
  --ink: #1b2030;
  --muted: #6a6f7e;
  --line: #e2ddd0;
  --key: #ffffff;
  --key-shadow: #d6d0c1;
  --fn: #ecE8de;
  --op: #e6ecfb;
  --op-ink: #2847b0;
  --accent: #2a4bb8;
  --accent-ink: #ffffff;
  --hl: #ffe680;
  --hl-ink: #1b2030;
  --err: #b42318;
  --err-bg: #fdecea;
  --tag-paren: #f3e3ff; --tag-paren-ink: #6b2fa3;
  --tag-pow: #dcf3f1;   --tag-pow-ink: #0f6b65;
  --g1: #2a4bb8; --g2: #d0453a; --g3: #1d8a4a; --g4: #9a3fc4; --g5: #c77a0a;
  --tag-trig: #fde6ef;  --tag-trig-ink: #a3245a;
  --tag-md: #e6ecfb;    --tag-md-ink: #2847b0;
  --tag-as: #e3f5e8;    --tag-as-ink: #1d7a3d;
  --tag-frac: #fff0dc;  --tag-frac-ink: #a3570b;
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161b; --panel: #1c1f26; --ink: #e9eaef; --muted: #9298a7; --line: #2d313b;
    --key: #262a33; --key-shadow: #0c0d10; --fn: #2c303a; --op: #25305a; --op-ink: #b4c4ff;
    --accent: #7090ff; --accent-ink: #0c1024; --hl: rgba(255, 210, 60, .32); --hl-ink: #fff6d6;
    --err: #ff9b91; --err-bg: #3a1f1f;
    --tag-paren: #34234a; --tag-paren-ink: #dcb8ff;
    --tag-pow: #173a38;   --tag-pow-ink: #8fe0d8;
    --g1: #7f9bff; --g2: #ff7f73; --g3: #5fd690; --g4: #cf8cff; --g5: #ffb547;
    --tag-trig: #3d1a2a;  --tag-trig-ink: #ffb3cf;
    --tag-md: #25305a;    --tag-md-ink: #b4c4ff;
    --tag-as: #1d3a28;    --tag-as-ink: #9de0b1;
    --tag-frac: #3d2c17;  --tag-frac-ink: #ffcb8a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14161b; --panel: #1c1f26; --ink: #e9eaef; --muted: #9298a7; --line: #2d313b;
  --key: #262a33; --key-shadow: #0c0d10; --fn: #2c303a; --op: #25305a; --op-ink: #b4c4ff;
  --accent: #7090ff; --accent-ink: #0c1024; --hl: rgba(255, 210, 60, .32); --hl-ink: #fff6d6;
  --err: #ff9b91; --err-bg: #3a1f1f;
  --tag-paren: #34234a; --tag-paren-ink: #dcb8ff;
  --tag-pow: #173a38;   --tag-pow-ink: #8fe0d8;
    --g1: #7f9bff; --g2: #ff7f73; --g3: #5fd690; --g4: #cf8cff; --g5: #ffb547;
    --tag-trig: #3d1a2a;  --tag-trig-ink: #ffb3cf;
    --tag-md: #25305a;    --tag-md-ink: #b4c4ff;
  --tag-as: #1d3a28;    --tag-as-ink: #9de0b1;
  --tag-frac: #3d2c17;  --tag-frac-ink: #ffcb8a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
}
button { font: inherit; color: inherit; }
kbd {
  font: 600 .8em/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  padding: .2em .45em; border-radius: 5px;
  background: var(--fn); border: 1px solid var(--line); border-bottom-width: 2px;
}

.app {
  max-width: 1060px;
  margin: 0 auto;
  padding: 28px 16px 48px;
  display: grid;
  grid-template-columns: minmax(0, 430px) minmax(0, 1fr);
  gap: 22px;
  align-items: start;
}
.top { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.top h1 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
.top p { margin: 0; color: var(--muted); font-size: 14px; }
@media (max-width: 840px) {
  .app { grid-template-columns: minmax(0, 1fr); padding-top: 18px; }
  .calc { max-width: 480px; width: 100%; justify-self: center; }
}

/* ---------- display ---------- */
.display {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px 16px 14px;
}
.disp-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 30px; }
.mode {
  flex: none; border: 1px solid var(--line); background: var(--fn); color: var(--ink);
  border-radius: 6px; padding: 3px 6px; cursor: pointer;
  font: 700 11px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .04em;
}
.ans-line { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg { display: inline-flex; background: var(--fn); border-radius: 9px; padding: 2px; flex: none; }
.seg button {
  border: 0; background: transparent; padding: 4px 9px; border-radius: 7px;
  font-size: 12.5px; color: var(--muted); cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); font-weight: 600; }

.expr {
  font-size: 30px;
  min-height: 78px;
  padding: 6px 2px;
  display: flex;
  align-items: center;
  overflow-x: auto;
  overflow-y: hidden;
  white-space: nowrap;
  cursor: text;
  scrollbar-width: thin;
}
.expr-in { display: inline-block; padding-right: 10px; }
.ph { color: var(--muted); font-size: 18px; margin-left: 6px; }
.hint { font-size: 12.5px; color: var(--muted); min-height: 19px; }
.hint kbd { font-size: 11px; }

.result {
  font-size: 34px; font-weight: 650; text-align: right;
  min-height: 58px; display: flex; justify-content: flex-end; align-items: center;
  overflow-x: auto; white-space: nowrap; font-variant-numeric: tabular-nums;
  border-top: 1px dashed var(--line); margin-top: 6px; padding-top: 6px;
}
.result.preview { color: var(--muted); font-weight: 500; font-size: 26px; }
.result .eqsign { color: var(--muted); font-weight: 400; margin-right: .3em; }
.result .err { font-size: 15px; font-weight: 500; color: var(--err); background: var(--err-bg); padding: 6px 10px; border-radius: 8px; white-space: normal; text-align: left; }
.alt { text-align: right; color: var(--muted); font-size: 16px; min-height: 22px; overflow-x: auto; }
.alt .fr { font-size: .85em; }

/* ---------- math typesetting ---------- */
.fr {
  display: inline-flex; flex-direction: column; align-items: stretch;
  vertical-align: middle; text-align: center;
  margin: 0 .1em; font-size: .9em; line-height: 1.15;
}
.fr > .fr-n { border-bottom: max(1.5px, .065em) solid currentColor; padding: 0 .18em .05em; }
.fr > .fr-d { padding: .05em .18em 0; }
.mx { display: inline-flex; align-items: center; vertical-align: middle; }
.mx-gap { display: inline-block; width: .1em; }
.op { margin: 0 .22em; }
.op.un { margin: 0 .04em 0 0; }
.ans { font-size: .78em; font-weight: 700; letter-spacing: .02em; color: var(--accent); }
.ghost { opacity: .3; }
.fnn { margin-right: .04em; }
.sup { display: inline-block; font-size: .62em; vertical-align: .8em; line-height: 1; margin-left: .04em; }
.rt { display: inline-flex; align-items: stretch; vertical-align: middle; margin: 0 .06em; line-height: 1.15; }
.rt-idx { font-size: .55em; align-self: flex-start; margin: .1em -.5em 0 0; min-width: .7em; text-align: right; position: relative; z-index: 1; }
.rt-svg { width: .6em; flex: none; overflow: visible; }
.rt-svg path { fill: none; stroke: currentColor; stroke-width: 1.8; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }
.rt-rad { border-top: 1.8px solid currentColor; padding: .1em .1em 0 .06em; margin-left: -1px; display: inline-flex; align-items: center; }
.rep { text-decoration: overline; text-decoration-thickness: .06em; }

.slot { display: inline-block; vertical-align: middle; min-width: .55em; }
.slot.empty {
  min-height: .9em; border: 1.5px dashed var(--muted); border-radius: 3px; opacity: .65;
  display: inline-flex; align-items: center; justify-content: center; padding: 0 .08em;
}
.slot.empty.on { border-color: var(--accent); opacity: 1; }
.cur {
  display: inline-block; width: 2px; height: 1.05em; margin: 0 -1px;
  background: var(--accent); vertical-align: middle; border-radius: 1px;
  animation: blink 1.05s steps(1) .5s infinite;
}
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .cur { animation: none; } }

/* ---------- keypad ---------- */
.pad { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
.k {
  position: relative; height: 58px; border: 0; border-radius: 12px;
  background: var(--key); color: var(--ink); font-size: 21px;
  box-shadow: 0 2px 0 var(--key-shadow), inset 0 0 0 1px var(--line);
  cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none;
  display: flex; align-items: center; justify-content: center; gap: 2px;
  transition: transform .06s, box-shadow .06s;
}
.k:active, .k.pressed { transform: translateY(2px); box-shadow: 0 0 0 var(--key-shadow), inset 0 0 0 1px var(--line); }
.k.fn { background: var(--fn); font-size: 16px; }
.k.op { background: var(--op); color: var(--op-ink); font-size: 24px; }
.k.eq { background: var(--accent); color: var(--accent-ink); font-size: 26px; box-shadow: 0 2px 0 color-mix(in srgb, var(--accent) 60%, #000); }
.k.danger { color: var(--err); font-weight: 600; }
.k .kb {
  position: absolute; top: 4px; right: 6px;
  font: 600 10px/1 ui-monospace, "SF Mono", Menlo, monospace;
  color: var(--muted); opacity: .85; pointer-events: none;
}
.k.eq .kb { color: var(--accent-ink); opacity: .7; }
.nohints .k .kb { display: none; }
.k small { font-size: 11px; color: var(--muted); display: block; line-height: 1; }
.k .stack { display: flex; flex-direction: column; align-items: center; gap: 3px; line-height: 1; }
.k .fr { font-size: 15px; }
.box { display: inline-block; width: .62em; height: .62em; border: 1.5px solid currentColor; border-radius: 2px; vertical-align: middle; }
.box.big { width: .8em; height: .9em; margin-right: 1px; }
.k.wide { grid-column: span 2; }
.sci { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-top: 14px; }
.sci .k { font-size: 13px; }
.k.on { background: var(--accent); color: var(--accent-ink); }
.k.on small, .k.on .kb { color: var(--accent-ink); }
.xv { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-style: italic; padding: 0 .04em; }
.fxlabel { color: var(--muted); margin-right: .3em; font-size: .85em; }
.alt .altnote { white-space: nowrap; }
.alt .altnote b { font-weight: 500; color: var(--ink); }
.graph-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
.graph-fns { display: flex; flex-direction: column; gap: 4px; min-width: 0; font-size: 17px; }
.graph-fn { display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow-x: auto; }
.graph-fn { cursor: pointer; border-radius: 8px; padding: 2px 6px; margin: 0 -6px; }
.graph-fn.sel { background: var(--fn); box-shadow: inset 3px 0 0 var(--accent); }
.graph-fn .sw { width: 14px; height: 4px; border-radius: 2px; flex: none; }
.graph-fn button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 0 4px; }
.graph-btns { display: flex; gap: 6px; flex: none; }
.graph-btns .btn { min-width: 34px; padding: 4px 10px; }
.graph-wrap { position: relative; }
#graphCanvas { width: 100%; height: min(440px, 62vw); min-height: 260px; display: block; border-radius: 10px; border: 1px solid var(--line); touch-action: none; cursor: grab; }
#graphCanvas.dragging { cursor: grabbing; }
.graph-pts { margin-top: 12px; font-size: 16px; }
.graph-pts h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.pt-group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 6px 0; border-top: 1px solid var(--line); }
.pt-title { color: var(--muted); font-size: 13.5px; min-width: 9em; }
.pt-title small { opacity: .8; }
.pt { white-space: nowrap; }
.pt-n { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%;
  font: 700 11px/1 system-ui, sans-serif; background: var(--ink); color: var(--panel); margin-right: 4px; vertical-align: middle; }
.graph-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; color: var(--muted); pointer-events: none; font-size: 15px; }
.sci .k { height: 40px; font-size: 14px; border-radius: 10px; box-shadow: 0 1px 0 var(--key-shadow), inset 0 0 0 1px var(--line); }
.sci .k .kb { font-size: 9px; top: 3px; right: 4px; }
.sci + .pad { margin-top: 8px; }
.k .stack b { font-size: 13px; }
.k .sup .box { width: .7em; height: .7em; }
.k .rt { font-size: 18px; }
.navpad { grid-row: span 3; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, 1fr); gap: 6px; }
.navpad .k { height: auto; font-size: 16px; border-radius: 10px; background: var(--fn); }
.navpad [data-act="up"], .navpad [data-act="down"] { grid-column: span 2; }
.navpad .k .kb { display: none; }

/* ---------- side panel ---------- */
.side {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  min-height: 420px; overflow: hidden;
}
.tabs { display: flex; border-bottom: 1px solid var(--line); padding: 0 8px; }
.tab {
  border: 0; background: none; padding: 12px 12px 10px; cursor: pointer; color: var(--muted);
  border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 550;
}
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.panel { padding: 16px 18px 20px; }
.panel[hidden] { display: none; }

.legend { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 12px; }
.legend .arrow { opacity: .6; }
.tag {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 2.3em; padding: 1px 6px; border-radius: 6px;
  font: 700 11.5px/1.5 ui-monospace, "SF Mono", Menlo, monospace; white-space: nowrap;
}
.t-paren { background: var(--tag-paren); color: var(--tag-paren-ink); }
.t-pow { background: var(--tag-pow); color: var(--tag-pow-ink); }
.t-trig { background: var(--tag-trig); color: var(--tag-trig-ink); }
.t-md { background: var(--tag-md); color: var(--tag-md-ink); }
.t-as { background: var(--tag-as); color: var(--tag-as-ink); }
.t-frac { background: var(--tag-frac); color: var(--tag-frac-ink); }
.t-rw { background: var(--fn); color: var(--muted); }

.steps { list-style: none; margin: 0; padding: 0; }
.steps li.line { display: grid; grid-template-columns: 1.3em minmax(0, 1fr); align-items: center; }
.steps .eqs { color: var(--muted); font-size: 20px; }
.steps .sx { font-size: 22px; overflow-x: auto; white-space: nowrap; padding: 4px 2px; }
.steps li.why {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  font-size: 13.5px; color: var(--muted); padding: 2px 0 2px 1.3em;
}
.steps li.why::before { content: "↓"; opacity: .6; margin-left: -1.1em; width: 1em; }
.steps li.why .fr { font-size: .95em; }
.hl { background: var(--hl); color: var(--hl-ink); border-radius: 5px; box-shadow: 0 0 0 3px var(--hl); }
.steps .final .sx { font-weight: 650; }
.msg { margin: 14px 0 0; font-size: 14px; color: var(--muted); }
.msg.err { color: var(--err); background: var(--err-bg); padding: 8px 12px; border-radius: 8px; }
.empty-state { color: var(--muted); font-size: 15px; }
.empty-state .ex { font-size: 22px; color: var(--ink); margin: 10px 0 14px; }
.empty-state ul { padding-left: 18px; margin: 8px 0 0; }
.empty-state li { margin: 4px 0; }

.hist { list-style: none; margin: 0; padding: 0; }
.hist li + li { border-top: 1px solid var(--line); }
.hist button {
  width: 100%; border: 0; background: none; text-align: left; cursor: pointer;
  padding: 10px 6px; border-radius: 8px; display: flex; align-items: center; gap: 10px;
  font-size: 19px; overflow-x: auto; white-space: nowrap;
}
.hist button:hover { background: var(--fn); }
.hist .res { margin-left: auto; font-weight: 650; padding-left: 12px; }
.hist .res .eqs { color: var(--muted); font-weight: 400; }
.textbtn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 4px 0; font-size: 14px; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.panel-head p { margin: 0; color: var(--muted); font-size: 14px; }

/* ---------- keybinds ---------- */
.kb-group h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 6px; }
.kb-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); }
.kb-row:first-of-type { border-top: 0; }
.kb-name { font-size: 15px; }
.kb-keys { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 2px; }
.chip button { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 0 4px; font-size: 15px; line-height: 1; }
.chip button:hover { color: var(--err); }
.kb-add { border: 1px dashed var(--line); background: none; border-radius: 6px; padding: 2px 8px; font-size: 12.5px; color: var(--muted); cursor: pointer; }
.kb-add:hover { color: var(--accent); border-color: var(--accent); }
.listening { font-size: 13px; color: var(--accent); font-weight: 600; animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
.btn { border: 1px solid var(--line); background: var(--fn); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 14px; }

.toast {
  position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px;
  font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  max-width: calc(100vw - 32px);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
@media (max-width: 420px) {
  .k { height: 52px; }
  .expr { font-size: 26px; }
  .seg button { padding: 4px 7px; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <h1>Fraction Calculator</h1>
    <p>Exact answers, order of operations shown step by step, and keys you can remap.</p>
  </header>

  <main class="calc">
    <section class="display" aria-label="Calculator display">
      <div class="disp-top">
        <button type="button" class="mode" id="angleBadge" title="Degrees or radians (click to switch)"></button>
        <span class="ans-line" id="ansLine"></span>
        <div class="seg" role="group" aria-label="Answer format">
          <button type="button" data-view="frac">Fraction</button>
          <button type="button" data-view="mixed">Mixed</button>
          <button type="button" data-view="dec">Decimal</button>
        </div>
      </div>
      <div class="expr" id="expr" aria-label="Expression"></div>
      <div class="hint" id="hint"></div>
      <div class="result" id="result" aria-live="polite"></div>
      <div class="alt" id="alt"></div>
    </section>
    <div class="sci" id="sci"></div>
    <div class="pad" id="pad"></div>
  </main>

  <aside class="side">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="steps">Steps</button>
      <button class="tab" role="tab" data-tab="history">History</button>

  if (owner === id) { toast(`${keyName(k)} is already bound to ${A[id].name}`); return; }
  if (owner) {
    S.keys[owner] = S.keys[owner].filter(x => x !== k);
    toast(`${keyName(k)} moved from “${A[owner].name}” to “${A[id].name}”`);
  } else toast(`${keyName(k)} → ${A[id].name}`);
  S.keys[id].push(k);
  save();
}

// ---------- persistence ----------
const STORE_KEY = 'fraction-calculator.v1';
const store = {
  get() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; } },
  set(v) { try { localStorage.setItem(STORE_KEY, JSON.stringify(v)); } catch {} },
};
const enV = v => (!v ? null : isPoly(v) ? { px: v.px.map(m => ({ k: m.k, c: enV(m.c) })), holes: holesOf(v).map(enV) }

  : isRad(v) ? { t: v.t.map(m => ({ c: enV(m.c), r: typeof m.r === 'bigint' ? String(m.r) : enV(m.r) })) }
  : isSurd(v) ? { c: enV(v.c), r: String(v.r), k: String(v.k) } : { n: String(v.n), d: String(v.d) });
function deV(o) {

    const v = o.px !== undefined ? { px: o.px.map(m => ({ k: Number(m.k), c: deV(m.c) })) } : { rn: deV(o.rn), rd: deV(o.rd) };
    if (o.holes && o.holes.length) v.holes = o.holes.map(deV);
    return v;
  }
  if (o.pp !== undefined) return { pp: o.pp.map(m => ({ k: Number(m.k), c: deV(m.c) })) };
  if (o.pi !== undefined) return mkPi(deV(o.pi)); // saved before π sums existed
  if (o.t !== undefined) return { t: o.t.map(m => ({ c: deV(m.c), r: typeof m.r === 'string' ? BigInt(m.r) : deV(m.r) })) };
  if (o.r !== undefined) return { c: deV(o.c), r: BigInt(o.r), k: BigInt(o.k) };

}
function validItems(arr) {
  return Array.isArray(arr) && arr.every(it => it && (
    (it.t === 'c' && typeof it.v === 'string' && /^[0-9.+\-*/()]$/.test(it.v)) ||
    it.t === 'ans' || it.t === 'pi' || it.t === 'x' ||
    (isTpl(it) && (it.t !== 'fn' || ((it.pw ??= []) && Object.hasOwn(FN_LABEL, it.name))) && SLOTS[it.t].every(s => validItems(it[s])))

}
function save() {
  store.set({
    keymapVersion: 7, pins: S.pins, fx: S.fx, view: S.view, angle: S.angle, hints: S.hints, autoExit: S.autoExit, tab: S.tab, keys: S.keys, ans: enV(S.ans),
    history: S.history.map(h => ({ items: h.items, v: enV(h.v), unit: h.unit })),
  });
}
function load() {
  const s = store.get();
  if (VIEWS.includes(s.view)) S.view = s.view;
  if (s.angle === 'rad') S.angle = 'rad';
  S.hints = s.hints !== false;
  S.autoExit = s.autoExit !== false;
  if (['steps', 'history', 'graph', 'keys'].includes(s.tab)) S.tab = s.tab;
  if (Array.isArray(s.pins)) S.pins = s.pins.filter(p => p && validItems(p.items)).slice(-5);
  S.fx = s.fx === true;
  for (const id in A) {
    const ks = s.keys && s.keys[id];
    S.keys[id] = Array.isArray(ks) ? ks.filter(k => typeof k === 'string' && k) : null;
  }
  // v1 had root on T, which is now tangent.
  if (!s.keymapVersion && S.keys.root && S.keys.root.length === 1 && S.keys.root[0] === 't') S.keys.root = ['r'];
  // v2 saved with Enter; Enter now moves to the next box and Q saves.
  if ((s.keymapVersion || 1) < 3 && S.keys.eq && S.keys.eq.includes('Enter')) {
    S.keys.eq = S.keys.eq.filter(k => k !== 'Enter');
    if (!keyOwner('q')) S.keys.eq.unshift('q');
  }
  for (const id in A) if (S.keys[id]) S.keys[id] = S.keys[id].map(k => (k === ' ' ? 'Space' : k));
  // Actions added since the keys were saved get their defaults, unless the key is already taken.
  for (const id in A) if (!S.keys[id]) S.keys[id] = DEFAULT_KEYS[id].filter(k => !keyOwner(k));
  // v6 added [ = / [ 8 / [ 0 as no-Shift shortcuts for + × and fractions (a short-lived v5 used - instead).
  if ((s.keymapVersion || 1) < 6) {
    for (const id of ['add', 'mul', 'frac']) S.keys[id] = S.keys[id].filter(k => !['- =', '- 8', '- 0'].includes(k));
    for (const [id, k] of [['add', '[ ='], ['mul', '[ 8'], ['frac', '[ 0']]) if (!keyOwner(k)) S.keys[id].push(k);

  // v7 added [ 6 for ^.
  if ((s.keymapVersion || 1) < 7 && !keyOwner('[ 6')) S.keys.pow.push('[ 6');
  try { if (s.ans) S.ans = deV(s.ans); } catch {}
  if (Array.isArray(s.history)) {
    for (const h of s.history) {
      try { if (validItems(h.items)) S.history.push({ items: h.items, v: deV(h.v), unit: h.unit === '°' ? '°' : '' }); } catch {}
    }
  }
}

// ---------- rendering ----------
const CUR = '<span class="cur"></span>';
let ARR_REG = [];

function opItem(it, prev) {
  const unary = (it.v === '-' || it.v === '+') && (!prev || (prev.t === 'c' && '+-*/('.includes(prev.v)));
  return { cls: 'ch op' + (unary ? ' un' : ''), txt: OPS[it.v] };
}

// Renders editor items. live = with cursor and click targets; otherwise a static copy (history).
function edArr(arr, path, isRoot, live) {
  const id = live ? ARR_REG.push(path) - 1 : 0;
  const here = live && samePath(path, S.cur.path);
  const at = i => (live ? ` data-a="${id}" data-i="${i}"` : '');
  if (!arr.length && !isRoot) {
    return `<span class="slot empty${here ? ' on' : ''}"${at(0)}>${here ? CUR : ''}</span>`;
  }
  let s = '', depth = 0;
  arr.forEach((it, i) => {
    if (here && S.cur.i === i) s += CUR;
    if (it.t === 'c') {
      if ('+-*/'.includes(it.v)) {
        const o = opItem(it, arr[i - 1]);
        s += `<span class="${o.cls}"${at(i)}>${o.txt}</span>`;
      } else s += `<span class="ch"${at(i)}>${it.v}</span>`;
      if (it.v === '(') depth++;
      else if (it.v === ')' && depth > 0) depth--;
    } else if (it.t === 'ans') {
      s += `<span class="ch ans"${at(i)}>Ans</span>`;
    } else if (it.t === 'pi') {
      s += `<span class="ch"${at(i)}>π</span>`;
    } else if (it.t === 'x') {
      s += `<span class="ch xv"${at(i)}>x</span>`;
    } else if (it.t === 'fn') {
      const pwPath = [...path, { idx: i, slot: 'pw' }];
      const showPw = it.pw.length || (live && samePath(S.cur.path.slice(0, pwPath.length), pwPath));
      const pw = showPw ? `<span class="sup">${edArr(it.pw, pwPath, false, live)}</span>` : '';
      s += `<span class="fnw"${at(i)}><span class="fnn">${FN_LABEL[it.name]}</span>${pw}(${edArr(it.arg, [...path, { idx: i, slot: 'arg' }], false, live)})</span>`;
    } else {
      const sub = slot => edArr(it[slot], [...path, { idx: i, slot }], false, live);
      if (it.t === 'pow') {
        s += `<span class="sup"${at(i)}>${sub('exp')}</span>`;
      } else if (it.t === 'root') {
        // The index box only shows once it's used (or the cursor is in it).
        const idxPath = [...path, { idx: i, slot: 'idx' }];
        const showIdx = it.idx.length || (live && samePath(S.cur.path.slice(0, idxPath.length), idxPath));
        s += rootHTML(sub('rad'), showIdx ? sub('idx') : null).replace('<span class="rt"', `<span class="rt"${at(i)}`);
      } else {
        const f = `<span class="fr"><span class="fr-n">${sub('num')}</span><span class="fr-d">${sub('den')}</span></span>`;
        s += it.t === 'frac'
          ? f.replace('<span class="fr"', `<span class="fr"${at(i)}`)
          : `<span class="mx"${at(i)}>${sub('whole')}<span class="mx-gap"></span>${f}</span>`;
      }
    }
  });
  if (here && S.cur.i === arr.length) s += CUR;
  s += '<span class="ghost">)</span>'.repeat(depth);
  return isRoot ? s : `<span class="slot">${s}</span>`;
}

function renderEditor() {

const kbd = id => (S.keys[id] && S.keys[id][0] ? `<kbd>${keyName(S.keys[id][0])}</kbd>` : `the ${A[id].label} button`);

function currentSolve() {
  if (!S.root.length) return null;
  const ans = S.committed ? S.committed.ansUsed : S.ans;
  return solve(S.root, { view: S.view, ans, angle: S.angle });
}

function renderResult(res) {
  resultEl.className = 'result';
  altEl.innerHTML = '';
  if (!res) { resultEl.innerHTML = ''; return; }
  if (S.committed && S.committed.error) {
    resultEl.innerHTML = '';
    const span = document.createElement('span');
    span.className = 'err';
    span.textContent = S.committed.error;
    resultEl.append(span);
    return;
  }
  if (res.error) {
    resultEl.innerHTML = res.notPoly && S.fx ? '<span class="eqsign">→</span><span class="altnote" style="font-size:16px">see the graph</span>' : '';
    if (res.notPoly) altEl.textContent = 'Not a polynomial, so there’s nothing to expand or factor';
    return;
  }
  if (!S.afterEval) resultEl.classList.add('preview');
  if (isAlg(res.value)) { renderAlgResult(res); return; }
  const v = res.value, main = valueHTML(v, S.view) + res.unit;
  resultEl.innerHTML = `<span class="eqsign">${eqSign(v, S.view)}</span><span>${main}</span>`; // own span: flex would flatten a ²
  const seen = new Set([main]), alts = [];
  for (const view of VIEWS) {
    const h = valueHTML(v, view) + res.unit;
    if (!seen.has(h)) { seen.add(h); alts.push(`${eqSign(v, view)} ${h}`); }

}

  const differs = fac !== null && fac !== ex, showFac = differs && !res.product;
  resultEl.innerHTML = `<span class="eqsign">=</span><span>${showFac ? fac : ex}</span>`;
  const notes = [];
  if (differs) notes.push(`${showFac ? 'expanded' : 'factored'}: <b>${showFac ? ex : fac}</b>`);
  const roots = rootsHTML(v, S.view);
  if (roots) notes.push(`roots: <i class="xv">x</i> = ${roots}`);
  if (holesOf(v).length) notes.push(holesOf(v).map(h => `<i class="xv">x</i> ≠ ${valueHTML(h, S.view)}`).join(', '));
  altEl.innerHTML = notes.map(n => `<span class="altnote">${n}</span>`).join(' · ');

const TAGS = { paren: '( )', trig: 'sin', pow: 'xⁿ √', md: '× ÷', as: '+ −', frac: 'a/b', rw: '↺' };
const EXAMPLE = `1 + 2 × (${fr('3', '4')} − ${fr('1', '2')})`;

function renderSteps(res) {
  const el = $('#panel-steps');
  if (!res) {
    el.innerHTML = `<div class="empty-state">
      Type a calculation and every step shows up here, in the order your teacher would do it. Try:
      <div class="ex">${EXAMPLE}</div>
      <ul>
        <li>Press ${kbd('frac')} after a number to make it the top of a fraction.</li>
        <li>${kbd('mixed')} makes a mixed number like 2<span class="mx-gap"></span>${fr('1', '2')}.</li>
        <li>${kbd('pow')} makes an exponent like 3<sup class="sup">2</sup>, and ${kbd('root')} a square root like ${rootHTML('12')} (answers stay exact: ${surdHTML({ c: Q(2n), r: 3n, k: 2n })}).</li>
        <li>${kbd('sin')} ${kbd('cos')} ${kbd('tan')} for trig — exact at every multiple of 1.5°: sin(30°) = ${fr('1', '2')}, sin(15°) = ${radHTML(sinQ1(30))}, sin(18°) = ${radHTML(sinQ1(36))}. ${kbd('angle')} switches degrees/radians and ${kbd('pi')} types π.</li>
        <li>${kbd('next')} moves to the next box: ${kbd('sin')} ${kbd('pow')} 2 ${kbd('next')} 3 0 is sin²(30°), while ${kbd('sin')} 3 0 ${kbd('pow')} 2 is sin(30²).</li>
        <li>${kbd('xvar')} types <i class="xv">x</i>: (<i class="xv">x</i> + 1)<sup class="sup">2</sup> expands to <i class="xv">x</i><sup class="sup">2</sup> + 2<i class="xv">x</i> + 1, and that factors back. ${kbd('graph')} graphs a function.</li>

    return;
  }

    <span class="tag t-paren">( )</span> first <span class="arrow">→</span>
    <span class="tag t-trig">sin</span> <span class="tag t-pow">xⁿ √</span> <span class="arrow">→</span>
    <span class="tag t-md">× ÷</span> left to right <span class="arrow">→</span>
    <span class="tag t-as">+ −</span> left to right</div>`;
  if (res.lines.length) {

    if (Number.isFinite(qy)) {
      ctx.strokeStyle = col('--muted'); ctx.lineWidth = 1; ctx.setLineDash([4, 4]); ctx.beginPath();
      ctx.moveTo(X(qx), 0); ctx.lineTo(X(qx), H); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = col(main.color); ctx.beginPath(); ctx.arc(X(qx), Y(qy), 4.5, 0, 7); ctx.fill();
      const label = `(${tickText(Number(qx.toPrecision(5)))}, ${tickText(Number(qy.toPrecision(5)))})`;
      ctx.font = '600 12px system-ui, sans-serif';
      const tw = ctx.measureText(label).width, bx = Math.min(W - tw - 14, X(qx) + 10), by = Math.max(4, Math.min(H - 26, Y(qy) - 30));
      ctx.fillStyle = col('--panel'); ctx.strokeStyle = col('--line'); ctx.beginPath(); ctx.rect(bx, by, tw + 10, 22); ctx.fill(); ctx.stroke();
      ctx.fillStyle = col('--ink'); ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(label, bx + 5, by + 11);
    }
  }
}
function zoomGraph(f, cx = 0.5, cy = 0.5) {
  const v = G.view, wx = v.x1 - v.x0, wy = v.y1 - v.y0, fx = v.x0 + wx * cx, fy = v.y1 - wy * cy;
  G.view = { x0: fx - (fx - v.x0) * f, x1: fx + (v.x1 - fx) * f, y0: fy - (fy - v.y0) * f, y1: fy + (v.y1 - fy) * f };
  G.auto = false;
  drawGraph();
  refreshKeyPoints();
}

// ---------- events ----------
// Multi-key shortcuts: the first key acts at once (c → cos), and if the next key arrives quickly
// and completes a longer shortcut (c s → csc), that first action is undone and replaced.
const SEQ_MS = 900;
let seq = null; // { keys, snap, timer }
const snapshot = () => structuredClone({
  root: S.root, cur: S.cur, afterEval: S.afterEval, committed: S.committed,
  view: S.view, angle: S.angle, ans: S.ans, history: S.history,
});
function endSeq() { if (seq) clearTimeout(seq.timer); seq = null; }
function startSeq(keys, snap) {
  endSeq();
  seq = { keys, snap, timer: setTimeout(() => { seq = null; renderHint(); }, SEQ_MS) };
}

function pressKeys(k) {
  if (seq) {
    const cand = seq.keys + ' ' + k, id = keyOwner(cand);
    if (id || isPrefix(cand)) {
      const snap = seq.snap;
      if (id) { Object.assign(S, structuredClone(snap)); A[id].run(); save(); }
      if (isPrefix(cand)) startSeq(cand, snap); else endSeq();
      return id || 'pending';
    }
    endSeq();
    // A quick Enter only confirms the first key (c ⏎ s → cos(sin …), not csc) and stays put.
    if (keyOwner(k) === 'next') return 'next';
  }
  const id = keyOwner(k), prefix = isPrefix(k);
  if (!id && !prefix) return null;
  const snap = prefix ? snapshot() : null;
  if (id) A[id].run();
  if (prefix) startSeq(k, snap);
  return id || 'pending';
}

let capTimer;
function finishCapture() {
  if (!S.capture) return;
  const id = S.capture, keys = S.capKeys.join(' ');
  S.capture = null;
  S.capKeys = [];
  if (keys) bindKey(id, keys);
  render();
}

document.addEventListener('keydown', e => {
  if (S.capture) {
    if (IGNORED_KEYS.has(e.key)) return;
    e.preventDefault();
    S.capKeys.push(normKey(e));
    clearTimeout(capTimer);
    capTimer = setTimeout(finishCapture, SEQ_MS);
    renderKeys();
    return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target.closest && e.target.closest('input, textarea, select')) return;
  const k = normKey(e);
  // Let Enter/Space activate a focused control in the side panel (keyboard accessibility).
  if ((k === 'Enter' || k === 'Space') && e.target.closest && e.target.closest('.side button, .seg button, .mode')) return;
  const id = pressKeys(k);
  if (!id) return;
  e.preventDefault();
  render();
  const b = document.querySelector(`.calc [data-act="${id}"]`);
  if (b) { b.classList.add('pressed'); setTimeout(() => b.classList.remove('pressed'), 110); }
});

for (const el of [padEl, $('#sci')]) {
  el.addEventListener('mousedown', e => { if (e.target.closest('[data-act]')) e.preventDefault(); });
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (b) { endSeq(); run(b.dataset.act); }
  });
}
$('#angleBadge').addEventListener('click', () => { toggleAngle(); render(); });

const graphCv = $('#graphCanvas');
graphCv.addEventListener('pointerdown', e => {
  if (!G.view) return;
  G.drag = { x: e.clientX, y: e.clientY, view: { ...G.view } };
  graphCv.setPointerCapture(e.pointerId);
  graphCv.classList.add('dragging');
});
graphCv.addEventListener('pointermove', e => {
  const r = graphCv.getBoundingClientRect();
  G.hover = { px: e.clientX - r.left, py: e.clientY - r.top };
  if (G.drag) {
    const v = G.drag.view, dx = (e.clientX - G.drag.x) / r.width * (v.x1 - v.x0), dy = (e.clientY - G.drag.y) / r.height * (v.y1 - v.y0);
    G.view = { x0: v.x0 - dx, x1: v.x1 - dx, y0: v.y0 + dy, y1: v.y1 + dy };
    G.auto = false;
  }
  drawGraph();
});
const endDrag = () => { if (G.drag) refreshKeyPoints(); G.drag = null; graphCv.classList.remove('dragging'); };
graphCv.addEventListener('pointerup', endDrag);
graphCv.addEventListener('pointercancel', endDrag);
graphCv.addEventListener('pointerleave', () => { G.hover = null; drawGraph(); });
graphCv.addEventListener('wheel', e => {
  e.preventDefault();
  const r = graphCv.getBoundingClientRect();
  zoomGraph(e.deltaY > 0 ? 1.15 : 1 / 1.15, (e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height);
}, { passive: false });
graphCv.addEventListener('dblclick', () => { G.auto = true; G.sig = ''; render(); });
$('#panel-graph').addEventListener('click', e => {
  const b = e.target.closest('[data-g]');
  if (b) {
    if (b.dataset.g === 'fit') { G.auto = true; G.sig = ''; render(); }
    else zoomGraph(b.dataset.g === 'in' ? 1 / 1.4 : 1.4);
    return;
  }
  const un = e.target.closest('[data-unpin]');
  if (un) { deletePin(+un.dataset.unpin); render(); return; }
  const row = e.target.closest('[data-row]');
  if (row && S.fx) { selectRow(row.dataset.row === '' ? null : +row.dataset.row); render(); }
});
new ResizeObserver(() => drawGraph()).observe(graphCv);

exprEl.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el) {
    S.cur = { path: [], i: S.root.length };
  } else {
    const path = ARR_REG[+el.dataset.a];
    let i = +el.dataset.i;
    if (!el.classList.contains('slot')) {
      const r = el.getBoundingClientRect();
      if (e.clientX > r.left + r.width / 2) i++;
    }
    S.cur = { path: path.map(p => ({ ...p })), i };
  }
  S.afterEval = false;
  render();
});

document.querySelector('.seg').addEventListener('click', e => {
  const b = e.target.closest('[data-view]');
  if (b) { setView(b.dataset.view); render(); }
});

document.querySelector('.tabs').addEventListener('click', e => {
  const t = e.target.closest('[data-tab]');
  if (!t) return;
  S.tab = t.dataset.tab;
  S.capture = null;
  save();
  render();
});

$('#panel-history').addEventListener('click', e => {
  if (e.target.closest('[data-clear-history]')) { S.history = []; save(); render(); return; }
  const b = e.target.closest('[data-hist]');
  if (!b) return;
  S.root = structuredClone(S.history[+b.dataset.hist].items);
  S.cur = { path: [], i: S.root.length };
  edited();
  render();
});

$('#panel-keys').addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-add]')) { S.capture = t.closest('[data-add]').dataset.add; S.capKeys = []; render(); return; }
  if (t.closest('[data-cancel]')) { clearTimeout(capTimer); S.capture = null; S.capKeys = []; render(); return; }
  const rm = t.closest('[data-rm]');
  if (rm) { S.keys[rm.dataset.rm] = S.keys[rm.dataset.rm].filter(k => k !== rm.dataset.key); save(); render(); return; }
  if (t.closest('[data-reset-keys]')) {
    for (const id in A) S.keys[id] = [...DEFAULT_KEYS[id]];
    S.capture = null;
    save();
    toast('Keybinds reset to defaults');
    render();
  }
});
$('#panel-keys').addEventListener('change', e => {
  if (e.target.id === 'hintsToggle') { S.hints = e.target.checked; save(); render(); }
  if (e.target.id === 'autoExitToggle') { S.autoExit = e.target.checked; save(); render(); }
});

load();
render();
</script>
</body>
