<style>
/* Ledger: bone paper, graphite ink, one vermilion signal. An instrument-panel display and
   hard-edged keys that physically depress. Schibsted Grotesk for words, Azeret Mono for every numeral. */
:root {
  --font-ui: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "Azeret Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --bg: #e9e5da;          /* paper */
  --panel: #f5f2eb;       /* surface */
  --sunk: #dcd7ca;
  --ink: #1b1a17;
  --ink-2: #47443d;
  --muted: #625e55;
  --line: #c9c3b5;
  --key: #f9f7f2;
  --key-edge: #b9b2a2;
  --key-fn: #dcd7ca;
  --key-fn-edge: #aaa391;
  --fn: #e4e0d5;
  --op: #1b1a17;
  --op-ink: #f5f2eb;
  --accent: #d43f1c;      /* signal: equals, active, errors */
  --accent-ink: #ffffff;
  --accent-edge: #8f2810;
  --hl: #f2d777;
  --hl-ink: #1b1a17;
  --err: #b8341a;
  --err-bg: #f6ddd3;
  --tag-paren: #ecdff2; --tag-paren-ink: #6a3488;
  --tag-pow: #d9ebe6;   --tag-pow-ink: #1e6457;
  --g1: #2f5aa0; --g2: #d43f1c; --g3: #3a7a35; --g4: #7d4aa3; --g5: #a8740c;
  --tag-trig: #f4dde2;  --tag-trig-ink: #9a2849;
  --tag-md: #dfe4ef;    --tag-md-ink: #2b4c8f;
  --tag-as: #dfeadb;    --tag-as-ink: #2f6a2b;
  --tag-frac: #f3e3c8;  --tag-frac-ink: #8a5208;
  /* The display is an LCD in both themes: the one thing on screen that is always the answer. */
  --disp: #20261f;
  --disp-ink: #d4e2bf;
  --disp-muted: #95a388;
  --disp-dim: #6f7c66;
  --disp-line: #3a4437;
  --disp-fn: #2c342a;
  --disp-accent: #e6f0d4;
  --disp-err: #ff7a57;
  --disp-err-bg: #3a221b;
  --r-1: 2px;
  --r-2: 4px;
  --r-3: 10px;
  --press: 3px;
  --ease: cubic-bezier(.2, .7, .2, 1);
  --ease-out: cubic-bezier(.22, 1, .36, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121211; --panel: #1b1b19; --sunk: #0d0d0c;
    --ink: #ece8df; --ink-2: #b7b2a7; --muted: #9a958a; --line: #2f2e2b;
    --key: #262623; --key-edge: #0a0a09; --key-fn: #33322e; --key-fn-edge: #0a0a09; --fn: #2a2a27;
    --op: #ece8df; --op-ink: #1b1a17;
    --accent: #ff5b34; --accent-ink: #160803; --accent-edge: #a3300f;
    --hl: #6b5a1c; --hl-ink: #fbf1cf;
    --err: #ff8a6b; --err-bg: #3a1d15;
    --tag-paren: #33253d; --tag-paren-ink: #dcb8f0;
    --tag-pow: #1c3330;   --tag-pow-ink: #93d8c8;
    --g1: #7fa3e8; --g2: #ff6e4a; --g3: #8acb6f; --g4: #c49be8; --g5: #e6b04a;
    --tag-trig: #3b1f27;  --tag-trig-ink: #f5b0c2;
    --tag-md: #222b3d;    --tag-md-ink: #b0c3ec;
    --tag-as: #1f3020;    --tag-as-ink: #a8d99a;
    --tag-frac: #382a15;  --tag-frac-ink: #f0c47e;
    --disp: #0a0c0a; --disp-ink: #c6ee7e; --disp-muted: #8aa267; --disp-dim: #4c5a38;
    --disp-line: #222a1b; --disp-fn: #161b12; --disp-accent: #e2fbb4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121211; --panel: #1b1b19; --sunk: #0d0d0c;
  --ink: #ece8df; --ink-2: #b7b2a7; --muted: #9a958a; --line: #2f2e2b;
  --key: #262623; --key-edge: #0a0a09; --key-fn: #33322e; --key-fn-edge: #0a0a09; --fn: #2a2a27;
  --op: #ece8df; --op-ink: #1b1a17;
  --accent: #ff5b34; --accent-ink: #160803; --accent-edge: #a3300f;
  --hl: #6b5a1c; --hl-ink: #fbf1cf;
  --err: #ff8a6b; --err-bg: #3a1d15;
  --tag-paren: #33253d; --tag-paren-ink: #dcb8f0;
  --tag-pow: #1c3330;   --tag-pow-ink: #93d8c8;
  --g1: #7fa3e8; --g2: #ff6e4a; --g3: #8acb6f; --g4: #c49be8; --g5: #e6b04a;
  --tag-trig: #3b1f27;  --tag-trig-ink: #f5b0c2;
  --tag-md: #222b3d;    --tag-md-ink: #b0c3ec;
  --tag-as: #1f3020;    --tag-as-ink: #a8d99a;
  --tag-frac: #382a15;  --tag-frac-ink: #f0c47e;
  --disp: #0a0c0a; --disp-ink: #c6ee7e; --disp-muted: #8aa267; --disp-dim: #4c5a38;
  --disp-line: #222a1b; --disp-fn: #161b12; --disp-accent: #e2fbb4;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.55 var(--font-ui);
  font-feature-settings: "ss01";
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--accent); color: var(--accent-ink); }
button { font: inherit; color: inherit; font-feature-settings: inherit; }
button:focus-visible, .tab:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
kbd {
  font: 500 .76em/1 var(--font-num); letter-spacing: .04em; text-transform: uppercase;
  padding: .3em .5em .26em; border-radius: var(--r-1);
  background: var(--key); color: var(--ink);
  border: 1px solid var(--key-edge); box-shadow: 0 1.5px 0 var(--key-edge);
}

.app {
  max-width: 1120px;
  margin: 0 auto;
  padding: 40px 24px 64px;
  display: grid;
  grid-template-columns: minmax(0, 440px) minmax(0, 1fr);
  gap: 28px;
  align-items: start;
}
.top { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 20px; margin-bottom: 4px; }
.top h1 { margin: 0; display: flex; align-items: center; gap: 12px; font-size: 32px; font-weight: 600; letter-spacing: -.03em; line-height: 1.1; }
.top h1 .dot { color: var(--accent); }
.top .mark { width: 32px; height: 32px; flex: none; align-self: center; }
/* The mark is the display in miniature: TeX's math-italic x (cmmi10), lit on the LCD. */
.top .mark .tile { fill: var(--disp); }
.top .mark .glyph { fill: var(--disp-ink); }
.top p { margin: 0; color: var(--ink-2); font-size: 15px; }
@media (max-width: 840px) {
  .app { grid-template-columns: minmax(0, 1fr); padding: 22px 16px 48px; gap: 20px; }
  .calc { max-width: 480px; width: 100%; justify-self: center; }
  .top { max-width: 480px; width: 100%; justify-self: center; }
}
/* Long steps scroll past; the calculator stays in reach. */
@media (min-width: 841px) and (min-height: 860px) {
  .calc { position: sticky; top: 24px; }
}

/* ---------- the device ---------- */
.calc {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r-3);
  padding: 16px;
  box-shadow: 0 1px 0 var(--line), 0 24px 48px -28px rgba(0, 0, 0, .35);
}
.calc-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
/* Adding-machine counter wheels: every answer ever saved. The units wheel is bone, the rest graphite. */
.tape-head { display: flex; align-items: center; gap: 10px; padding-bottom: 14px; margin-bottom: 16px; border-bottom: 1px dashed var(--line); font: 500 10px/1 var(--font-num); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.counter { display: inline-flex; align-items: center; gap: 7px; font: 500 10px/1 var(--font-num); letter-spacing: .08em; color: var(--muted); }
.wheels {
  display: flex; gap: 1px; padding: 2px; background: #0d0c0b; border-radius: var(--r-1);
  box-shadow: inset 0 1px 1px rgba(0, 0, 0, .6), 0 1px 0 var(--line);
}
.wheel {
  width: 16px; height: 22px; overflow: hidden; display: grid; place-items: center;
  background: linear-gradient(#0f0e0d, #2e2b27 28%, #3a3631 50%, #2e2b27 72%, #0f0e0d);
  color: #f1ece0; font: 500 13px/1 var(--font-num);
}
.wheel:last-child { background: linear-gradient(#8f897b, #e9e5da 30%, #f9f7f2 50%, #e9e5da 70%, #8f897b); color: #1b1a17; }
.wheel b { display: block; font-weight: inherit; }
.wheel.roll b { animation: roll .5s var(--ease-out); }
@keyframes roll { from { transform: translateY(110%); } }
.seg { display: inline-flex; padding: 2px; gap: 2px; background: var(--sunk); border-radius: var(--r-2); flex: none; }
.seg button {
  border: 0; background: transparent; padding: 6px 10px; border-radius: var(--r-1);
  font: 500 11px/1 var(--font-num); letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted); cursor: pointer;
  transition: background-color .15s, color .15s;
}
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 0 var(--key-edge); }

/* Pages: the calculator, the System solver and Simplify / factor. */
.pages { margin-left: auto; align-self: center; }
.pages .pk { margin-left: 7px; font-size: 9px; opacity: .55; }
@media (max-width: 840px) { .pages { margin-left: 0; } }

/* ---------- display ---------- */
.display {
  --ink: var(--disp-ink); --muted: var(--disp-muted); --line: var(--disp-line); --fn: var(--disp-fn);
  --accent: var(--disp-accent); --err: var(--disp-err); --err-bg: var(--disp-err-bg);
  --key: var(--disp-fn); --key-edge: var(--disp-line);
  position: relative;
  background: var(--disp);
  color: var(--ink);
  border-radius: var(--r-2);
  padding: 12px 16px 16px;
  color-scheme: dark;
  box-shadow: inset 0 2px 0 rgba(0, 0, 0, .35), inset 0 0 0 1px rgba(0, 0, 0, .4);
  outline: 2px solid transparent; outline-offset: 3px;
  transition: outline-color .15s;
  overflow: hidden;
}
.display::after { /* scanline grain */
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .025) 0 1px, transparent 1px 3px);
}
.disp-top { display: flex; align-items: center; gap: 12px; min-height: 18px; font: 500 10px/1 var(--font-num); letter-spacing: .08em; }
.ans-line { flex: 1 1 0; min-width: 0; font-size: 12px; letter-spacing: 0; color: var(--disp-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.expr {
  font: 400 28px/1.3 var(--font-num);
  letter-spacing: -.02em;
  min-height: 88px;
  padding: 10px 2px 6px;
  display: flex;
  align-items: center;
  overflow-x: auto;
  overflow-y: hidden;
  white-space: nowrap;
  cursor: text;
  scrollbar-width: thin;
}
.expr-in { display: inline-block; padding-right: 10px; }
.ph { color: var(--disp-dim); font: 400 15px/1.3 var(--font-num); letter-spacing: 0; margin-left: 8px; }
/* Always two lines tall (three on phones), so the display keeps one size whatever the hint says. */
.hint { font-size: 13px; color: var(--muted); line-height: 1.7; height: 3.4em; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
.hint kbd { font-size: 10.5px; box-shadow: none; }

.result {
  font: 300 48px/1 var(--font-num); letter-spacing: -.04em; text-align: right;
  font-variant-numeric: tabular-nums slashed-zero;
  min-height: 76px; display: flex; justify-content: flex-end; align-items: center;
  overflow-x: auto; white-space: nowrap;
  margin-top: 8px; padding-top: 4px;
  border-top: 1px dashed var(--disp-line);
  transform-origin: right center;
}
.result:not(.preview):not(:empty) { animation: land .42s var(--ease-out); }
@keyframes land { from { opacity: .35; transform: translateY(6px); } }
.result.preview { color: var(--muted); font-weight: 300; font-size: 32px; letter-spacing: -.03em; }
.result .eqsign { color: var(--muted); font-weight: 300; margin-right: .3em; }
.result .err { font: 500 13px/1.45 var(--font-ui); letter-spacing: 0; color: var(--err); background: var(--err-bg); padding: 8px 12px; border-radius: var(--r-2); white-space: normal; text-align: left; }
.alt { text-align: right; color: var(--muted); font: 400 14px/1.6 var(--font-num); min-height: 22px; overflow-x: auto; }
.alt .fr { font-size: .85em; }

/* ---------- math typesetting ---------- */
.fr {
  display: inline-flex; flex-direction: column; align-items: stretch;
  vertical-align: middle; text-align: center;
  margin: 0 .1em; font-size: .9em; line-height: 1.15;
}
.fr > .fr-n { border-bottom: max(1.5px, .06em) solid currentColor; padding: 0 .18em .06em; }
.fr > .fr-d { padding: .06em .18em 0; }
.mx { display: inline-flex; align-items: center; vertical-align: middle; }
.mx-gap { display: inline-block; width: .1em; }
.op { margin: 0 .18em; }
.ch.op, .ch.eqch { line-height: 1; }
.op.un { margin: 0 .04em 0 0; }
.ans { font: 600 .74em/1 var(--font-num); letter-spacing: .04em; text-transform: uppercase; color: var(--accent); }
.ghost { opacity: .3; }
.fnn { margin-right: .04em; }
.sup { display: inline-block; font-size: .62em; vertical-align: .8em; line-height: 1; margin-left: .04em; }
.sub { display: inline-block; font-size: .62em; vertical-align: -.45em; line-height: 1; margin: 0 .06em 0 .02em; }
.rt { display: inline-flex; align-items: stretch; vertical-align: middle; margin: 0 .06em; line-height: 1.15; }
.rt-idx { font-size: .55em; align-self: flex-start; margin: .1em -.5em 0 0; min-width: .7em; text-align: right; position: relative; z-index: 1; }
.rt-svg { width: .6em; flex: none; overflow: visible; }
.rt-svg path { fill: none; stroke: currentColor; stroke-width: 1.8; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }
.rt-rad { border-top: 1.8px solid currentColor; padding: .1em .1em 0 .06em; margin-left: -1px; display: inline-flex; align-items: center; }
.rep { text-decoration: overline; text-decoration-thickness: .06em; }

.slot { display: inline-block; vertical-align: middle; min-width: .55em; }
.slot.empty {
  min-height: .9em; border: 1.5px dashed var(--muted); border-radius: var(--r-1); opacity: .6;
  display: inline-flex; align-items: center; justify-content: center; padding: 0 .08em;
  transition: border-color .15s, opacity .15s;
}
.slot.empty.on { border-color: var(--accent); border-style: solid; opacity: 1; }
.ch.eqch { margin: 0 .3em; }
/* Repeating digits typed with \ : the bar sits over the box. */
.repw > .slot { vertical-align: baseline; border-top: .06em solid currentColor; line-height: 1.05; }
.repw > .slot.empty { border-top-style: solid; }
.cur {
  display: inline-block; width: 2px; height: 1.05em; margin: 0 -1px;
  background: var(--accent); vertical-align: middle;
  animation: blink 1.05s steps(1) .5s infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* System solver: both equations on the LCD, the one being typed lit. */
.expr.sys { flex-direction: column; align-items: stretch; justify-content: center; gap: 4px; padding: 4px 0; font-size: 21px; }
.sysrow { display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 0 6px; border-radius: var(--r-1); opacity: .5; cursor: pointer; white-space: nowrap; }
.sysrow.on { opacity: 1; background: rgba(255, 255, 255, .045); cursor: text; }
.rowno { flex: none; display: grid; place-items: center; width: 18px; height: 18px; border: 1px solid var(--disp-line); border-radius: 50%; font: 500 10px/1 var(--font-num); color: var(--disp-muted); }
.sysrow.on .rowno { border-color: var(--disp-ink); color: var(--disp-ink); }
.sysrow .ph { font-size: 13px; margin-left: 4px; }
.result.multi { font-size: 22px; letter-spacing: -.02em; }
.result.multi .op { margin: 0 .5em; color: var(--muted); }
.rowtag { color: var(--muted); margin-right: .5em; }
.approx { color: var(--muted); font-size: .8em; margin-left: .7em; white-space: nowrap; }

/* A key that does nothing on its own ([) is waiting for the rest of its shortcut: the LCD is ringed. */
.display.seq-wait { outline-color: var(--accent); }

/* ---------- keypad ---------- */
.pad { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
.k {
  position: relative; height: 60px;
  border: 1px solid var(--key-edge); border-radius: var(--r-2);
  background: var(--key); color: var(--ink);
  font: 400 22px/1 var(--font-num);
  font-variant-numeric: tabular-nums slashed-zero;
  box-shadow: 0 var(--press) 0 0 var(--key-edge);
  cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none;
  display: flex; align-items: center; justify-content: center; gap: 2px;
  margin-bottom: var(--press);
  transition: transform 70ms var(--ease), box-shadow 70ms var(--ease), background-color .12s, color .12s;
}
.k:hover { filter: brightness(1.03); }
.k:active, .k.pressed { transform: translateY(var(--press)); box-shadow: 0 0 0 0 var(--key-edge); }
.k.fn { background: var(--key-fn); border-color: var(--key-fn-edge); box-shadow: 0 var(--press) 0 0 var(--key-fn-edge); font: 500 15px/1 var(--font-num); letter-spacing: .04em; }
.k.fn:active, .k.fn.pressed { box-shadow: 0 0 0 0 var(--key-fn-edge); }
.k.op { background: var(--op); color: var(--op-ink); border-color: var(--op); font-size: 26px; margin: 0 0 var(--press); }
.k.eq { background: var(--accent); color: var(--accent-ink); border-color: var(--accent-edge); box-shadow: 0 var(--press) 0 0 var(--accent-edge); font-size: 28px; }
.k.eq:active, .k.eq.pressed { box-shadow: 0 0 0 0 var(--accent-edge); }
.k.danger { color: var(--accent); font-weight: 600; }
/* Azeret Mono has no ⌫; the system face draws it properly. */
.k[data-act="back"], .k[data-act="back"] .kb { font-family: system-ui, -apple-system, sans-serif; }
.k .kb { /* secondary legend, top-left */
  position: absolute; top: 5px; left: 7px;
  font: 500 9px/1 var(--font-num); letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted); pointer-events: none;
}
.k.op .kb, .k.eq .kb { color: inherit; opacity: .6; }
.nohints .k .kb { display: none; }
.k small { font: 500 9px/1 var(--font-num); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: block; }
.k .stack { display: flex; flex-direction: column; align-items: center; gap: 4px; line-height: 1; }
.k .fr { font-size: 14px; }
.box { display: inline-block; width: .62em; height: .62em; border: 1.5px solid currentColor; border-radius: 1px; vertical-align: middle; }
.box.big { width: .8em; height: .9em; margin-right: 1px; }
.k.wide { grid-column: span 2; }
.sci { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-top: 16px; }
.k.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent-edge); box-shadow: 0 var(--press) 0 0 var(--accent-edge); }
.k.on small, .k.on .kb { color: var(--accent-ink); opacity: .75; }
.k.dim { opacity: .4; }
.xv { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-style: italic; font-weight: 400; padding: 0 .04em; letter-spacing: 0; }
.fxlabel { color: var(--muted); margin-right: .3em; font-size: .85em; }
.alt .altnote { white-space: nowrap; }
.alt .altnote b { font-weight: 600; color: var(--ink); }
.sci .k { height: 46px; padding-top: 8px; font: 500 12px/1 var(--font-num); letter-spacing: -.02em; background: var(--key-fn); border-color: var(--key-fn-edge); box-shadow: 0 var(--press) 0 0 var(--key-fn-edge); }
.sci .k:active, .sci .k.pressed { box-shadow: 0 0 0 0 var(--key-fn-edge); }
.sci .k.on { background: var(--accent); border-color: var(--accent-edge); box-shadow: 0 var(--press) 0 0 var(--accent-edge); }
.sci .k .kb { top: 4px; left: 6px; }
.sci + .pad { margin-top: 10px; }
.k .stack b { font-size: 12px; font-weight: 600; }
.k .sup .box { width: .7em; height: .7em; }
.k .rt { font-size: 18px; }
.navpad { grid-row: span 3; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, 1fr); gap: 6px; margin-bottom: var(--press); }
.navpad .k { height: auto; font-size: 16px; background: var(--key-fn); border-color: var(--key-fn-edge); box-shadow: 0 var(--press) 0 0 var(--key-fn-edge); margin-bottom: 0; }
.navpad .k:active, .navpad .k.pressed { box-shadow: 0 0 0 0 var(--key-fn-edge); }
.navpad [data-act="up"], .navpad [data-act="down"] { grid-column: span 2; }
.navpad .k .kb { display: none; }

/* ---------- graph ---------- */
.graph-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
.graph-fns { display: flex; flex-direction: column; gap: 4px; min-width: 0; font: 400 15px/1.5 var(--font-num); }
.graph-fn { display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow-x: auto; }
.graph-fn { cursor: pointer; border-radius: var(--r-2); padding: 3px 8px; margin: 0 -8px; transition: background-color .15s; }
.graph-fn.sel { background: var(--sunk); }
.graph-fn .sw { width: 16px; height: 3px; flex: none; }
.graph-fn button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 0 4px; }
.graph-fn button:hover { color: var(--accent); }
.graph-btns { display: flex; gap: 6px; flex: none; }
.graph-btns .btn { min-width: 36px; justify-content: center; padding: 0 12px; }
.graph-wrap { position: relative; }
#graphCanvas { width: 100%; height: min(440px, 62vw); min-height: 260px; display: block; border-radius: var(--r-2); border: 1px solid var(--line); touch-action: none; cursor: grab; }
#graphCanvas.dragging { cursor: grabbing; }
.graph-pts { margin-top: 14px; font: 400 14px/1.6 var(--font-num); }
.graph-pts h4 { margin: 0 0 6px; }
.pt-group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 8px 0; border-top: 1px solid var(--line); }
.pt-title { color: var(--muted); font: 400 13px/1.4 var(--font-ui); min-width: 9em; }
.pt-title small { opacity: .85; }
.pt { white-space: nowrap; }
.pt-n { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%;
  font: 600 10px/1 var(--font-num); background: var(--ink); color: var(--panel); margin-right: 4px; vertical-align: middle; }
.graph-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; color: var(--muted); pointer-events: none; font-size: 14px; }

/* ---------- side panel ---------- */
.side {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-3);
  box-shadow: 0 1px 0 var(--line);
  min-height: 420px; overflow: hidden;
}
.tabs { display: flex; gap: 2px; padding: 8px 12px 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab {
  position: relative; border: 0; background: none; padding: 14px 14px 13px; cursor: pointer; color: var(--muted);
  font: 500 11px/1 var(--font-num); letter-spacing: .08em; text-transform: uppercase; transition: color .15s;
}
.tab::after {
  content: ""; position: absolute; left: 14px; right: 14px; bottom: -1px; height: 2px;
  background: var(--accent); transform: scaleX(0); transition: transform .25s var(--ease-out);
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); font-weight: 600; }
.tab[aria-selected="true"]::after { transform: scaleX(1); }
.panel { padding: 22px 26px 26px; }
.panel:not([hidden]) { animation: rise .32s var(--ease-out); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
.panel[hidden] { display: none; }

.legend { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 16px; }
.legend .arrow { opacity: .6; }
.tag {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 2.3em; height: 22px; padding: 0 7px; border-radius: var(--r-1);
  font: 500 11px/1 var(--font-num); letter-spacing: .04em; white-space: nowrap;
}
.t-paren { background: var(--tag-paren); color: var(--tag-paren-ink); }
.t-pow { background: var(--tag-pow); color: var(--tag-pow-ink); }
.t-trig, .t-log { background: var(--tag-trig); color: var(--tag-trig-ink); }
.t-md { background: var(--tag-md); color: var(--tag-md-ink); }
.t-as { background: var(--tag-as); color: var(--tag-as-ink); }
.t-frac { background: var(--tag-frac); color: var(--tag-frac-ink); }
.t-rw { background: var(--sunk); color: var(--muted); }

.steps { list-style: none; margin: 0; padding: 0; }
.steps li.line { display: grid; grid-template-columns: 1.4em minmax(0, 1fr); align-items: center; }
.steps .eqs { color: var(--muted); font: 300 20px/1 var(--font-num); }
.steps .sx { font: 400 21px/1.35 var(--font-num); letter-spacing: -.02em; overflow-x: auto; white-space: nowrap; padding: 5px 2px; }
.steps li.why {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  font-size: 13.5px; color: var(--muted); padding: 3px 0 3px 1.4em;
}
.steps li.why::before { content: "↓"; opacity: .6; margin-left: -1.2em; width: 1em; }
.steps li.why .fr { font-size: .95em; }
.hl { background: var(--hl); color: var(--hl-ink); border-radius: var(--r-1); box-shadow: 0 0 0 3px var(--hl); }
.steps .final { margin-top: 4px; padding-top: 4px; border-top: 3px double var(--line); }
.steps .final .sx { font-weight: 600; }
/* Forms of a line or parabola, and systems, under the steps */
.extra { margin-top: 22px; border-top: 1px dashed var(--line); padding-top: 16px; }
.extra h4, .graph-pts h4 { margin: 0 0 8px; font: 500 11px/1 var(--font-num); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.form-row { display: grid; grid-template-columns: 9.5em minmax(0, 1fr); gap: 10px; align-items: center; padding: 5px 0; }
.form-name { font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
.form-name small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
.form-eq { font: 400 17px/1.4 var(--font-num); letter-spacing: -.02em; overflow-x: auto; white-space: nowrap; padding: 2px; }
.form-eq.none { font: 400 13.5px/1.5 var(--font-ui); color: var(--muted); white-space: normal; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13.5px; color: var(--muted); margin: 8px 0 2px; }
.facts span > b { color: var(--ink); font: 600 1em/1 var(--font-num); }
.extra details { margin-top: 10px; font-size: 14px; }
.extra summary { cursor: pointer; color: var(--ink); font-weight: 600; text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
.extra summary:hover { color: var(--accent); }
.extra .steps .sx { font-size: 17px; }
.extra .steps li.why { flex-wrap: nowrap; align-items: baseline; }
.sys + .sys { margin-top: 16px; }
.sys-title { font-size: 14px; font-weight: 700; margin: 4px 0; }
.sys-ans { margin: 6px 0 0; font-size: 15px; }
.sys-ans b { font-weight: 700; }
@media (max-width: 520px) { .form-row { grid-template-columns: 1fr; gap: 0; } }
.msg { margin: 16px 0 0; font-size: 14px; color: var(--muted); line-height: 1.6; }
.msg.err { color: var(--err); background: var(--err-bg); padding: 10px 14px; border-radius: var(--r-2); }
.empty-state { color: var(--ink-2); font-size: 15px; line-height: 1.6; max-width: 62ch; margin: 0; }
.empty-state .ex { font: 400 24px/1.3 var(--font-num); letter-spacing: -.02em; color: var(--ink); margin: 14px 0 18px; }
.empty-state ul { padding-left: 18px; margin: 8px 0 0; }
.empty-state li { margin: 8px 0; }
.empty-state li::marker { color: var(--accent); }

/* History is adding-machine tape: mono figures, dashed rules, a double rule under each total. */
.hist { list-style: none; margin: 0; padding: 0; }
.hist li + li { border-top: 1px dashed var(--line); }
.hist button {
  width: 100%; border: 0; background: none; text-align: left; cursor: pointer;
  padding: 11px 10px; border-radius: var(--r-2); display: flex; align-items: center; gap: 10px;
  font: 400 17px/1.4 var(--font-num); letter-spacing: -.02em; overflow-x: auto; white-space: nowrap;
  transition: background-color .15s;
}
.hist button:hover { background: var(--sunk); }
.hist .res { margin-left: auto; font-weight: 600; padding-left: 12px; }
.hist .res .eqs { color: var(--muted); font-weight: 300; }
.textbtn { border: 0; background: none; color: var(--ink); cursor: pointer; padding: 4px 0; font-size: 14px; font-weight: 600; text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
.textbtn:hover { color: var(--accent); }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.panel-head p { margin: 0; color: var(--muted); font-size: 14px; }

/* ---------- trig formulas ---------- */
.id-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 7px 0; border-top: 1px dashed var(--line); }
.kb-group h3 + .id-row { border-top: 0; }
.id-eq { font: 400 16px/1.5 var(--font-num); letter-spacing: -.02em; overflow-x: auto; white-space: nowrap; min-width: 0; }
.id-eq small { font: 500 10px/1 var(--font-num); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.id-row .textbtn { flex: none; font-size: 13px; }
.tv { border-collapse: collapse; font: 400 15px/1.4 var(--font-num); }
.tv th, .tv td { padding: 6px 12px 6px 0; text-align: left; vertical-align: middle; }
.tv th { font: 500 11px/1 var(--font-num); letter-spacing: .06em; color: var(--muted); }
.tv tr + tr { border-top: 1px dashed var(--line); }

/* ---------- keybinds ---------- */
.kb-group h3 { font: 500 11px/1 var(--font-num); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 28px 0 8px; }
.kb-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.kb-row:first-of-type { border-top: 0; }
.kb-name { font-size: 14.5px; }
.kb-keys { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 2px; }
.chip button { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 0 4px; font-size: 15px; line-height: 1; }
.chip button:hover { color: var(--accent); }
.kb-add { border: 1px dashed var(--line); background: none; border-radius: var(--r-1); height: 24px; padding: 0 8px; font: 500 11px/1 var(--font-num); letter-spacing: .04em; color: var(--muted); cursor: pointer; transition: color .15s, border-color .15s; }
.kb-add:hover { color: var(--accent); border-color: var(--accent); }
.listening { font: 600 11px/1 var(--font-num); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }
.check { display: inline-flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; }
.check input {
  appearance: none; position: relative; cursor: pointer; flex: none;
  width: 36px; height: 20px; margin: 0;
  background: var(--sunk); border: 1px solid var(--line); border-radius: 999px;
  transition: background-color .15s var(--ease);
}
.check input::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
  background: var(--ink); border-radius: 50%; transition: transform .15s var(--ease);
}
.check input:checked { background: var(--accent); border-color: var(--accent-edge); }
.check input:checked::after { transform: translateX(16px); background: var(--accent-ink); }
.btn {
  display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px; cursor: pointer;
  font: 600 13px/1 var(--font-ui); color: var(--ink); background: transparent;
  border: 1px solid var(--line); border-radius: var(--r-2);
  transition: border-color .15s, background-color .15s, color .15s;
}
.btn:hover { border-color: var(--ink); }
.btn:active { background: var(--sunk); }

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px);
  background: var(--ink); color: var(--panel); padding: 11px 16px; border-radius: var(--r-2);
  font-size: 14px; font-weight: 500; text-align: center; opacity: 0; pointer-events: none;
  transition: opacity .25s var(--ease-out), transform .35s var(--ease-out);
  box-shadow: 0 12px 24px -12px rgba(0, 0, 0, .4);
  max-width: calc(100vw - 32px);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

/* First paint: the header, then the device, then the steps. */
.top, .calc, .side { animation: enter .6s var(--ease-out) backwards; }
.calc { animation-delay: .06s; }
.side { animation-delay: .16s; }
@keyframes enter { from { opacity: 0; transform: translateY(14px); } }

@media (max-width: 520px) {
  .sci { gap: 5px; }
  .sci .k { height: 40px; font-size: 10.5px; letter-spacing: -.04em; padding: 0; }
  .sci .k .kb, .sci .k small { display: none; }
  .panel { padding: 18px 18px 22px; }
}
@media (max-width: 420px) {
  .calc { padding: 12px; }
  .k { height: 52px; }
  .pad { gap: 7px; }
  .expr { font-size: 24px; min-height: 78px; }
  .result { font-size: 40px; min-height: 62px; }
  .result.preview { font-size: 28px; }
  .display { padding: 10px 14px 14px; }
  .sysrow { min-height: 32px; }
  .expr.sys { font-size: 18px; }
  .pages .pk { display: none; }
  .hint { height: 5.1em; -webkit-line-clamp: 3; }
  .seg button { padding: 6px 7px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .cur { animation: none; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <h1><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect class="tile" width="32" height="32" rx="4"/><path class="glyph" transform="matrix(4 0 0 4 4.92 24.59)" d="M3.328-3.009C3.387-3.268 3.616-4.184 4.314-4.184C4.364-4.184 4.603-4.184 4.812-4.055C4.533-4.005 4.334-3.756 4.334-3.517C4.334-3.357 4.443-3.168 4.712-3.168C4.932-3.168 5.25-3.347 5.25-3.746C5.25-4.264 4.663-4.403 4.324-4.403C3.746-4.403 3.397-3.875 3.278-3.646C3.029-4.304 2.491-4.403 2.202-4.403C1.166-4.403 .598-3.118 .598-2.869C.598-2.77 .697-2.77 .717-2.77C.797-2.77 .827-2.79 .847-2.879C1.186-3.935 1.843-4.184 2.182-4.184C2.371-4.184 2.72-4.095 2.72-3.517C2.72-3.208 2.55-2.54 2.182-1.146C2.022-.528 1.674-.11 1.235-.11C1.176-.11 .946-.11 .737-.239C.986-.289 1.205-.498 1.205-.777C1.205-1.046 .986-1.126 .837-1.126C.538-1.126 .289-.867 .289-.548C.289-.09 .787 .11 1.225 .11C1.883 .11 2.242-.588 2.271-.648C2.391-.279 2.75 .11 3.347 .11C4.374 .11 4.941-1.176 4.941-1.425C4.941-1.524 4.852-1.524 4.822-1.524C4.732-1.524 4.712-1.484 4.692-1.415C4.364-.349 3.686-.11 3.367-.11C2.979-.11 2.819-.428 2.819-.767C2.819-.986 2.879-1.205 2.989-1.644L3.328-3.009Z"/></svg><span>Calculator<span class="dot">.</span></span></h1>
    <p>Exact answers, order of operations shown step by step, and keys you can remap.</p>
    <nav class="seg pages" aria-label="Pages">
      <button type="button" data-page="main">Calculator<span class="pk"></span></button>
      <button type="button" data-page="system">Systems<span class="pk"></span></button>
      <button type="button" data-page="simplify">Simplify<span class="pk"></span></button>
    </nav>
  </header>

  <main class="calc">
    <div class="calc-head">
      <div class="seg" role="group" aria-label="Angle unit">
        <button type="button" data-angle="deg">Deg</button>
        <button type="button" data-angle="rad">Rad</button>
      </div>
      <div class="seg" role="group" aria-label="Answer format">
        <button type="button" data-view="frac">Fraction</button>
        <button type="button" data-view="mixed">Mixed</button>
        <button type="button" data-view="dec">Decimal</button>
      </div>
    </div>
    <section class="display" aria-label="Calculator display">
      <div class="disp-top">
        <span class="ans-line" id="ansLine"></span>
      </div>
      <div class="expr" id="expr" aria-label="Expression"></div>
      <div class="hint" id="hint"></div>
      <div class="result" id="result" aria-live="polite"></div>
      <div class="alt" id="alt"></div>
    </section>
    <div class="sci" id="sci"></div>
    <div class="pad" id="pad"></div>
  </main>

  <aside class="side">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="steps">Steps</button>
      <button class="tab" role="tab" data-tab="history">History</button>
      <button class="tab" role="tab" data-tab="graph">Graph</button>
      <button class="tab" role="tab" data-tab="trig">Trig</button>
      <button class="tab" role="tab" data-tab="keys">Keybinds</button>
    </div>
    <div class="panel" id="panel-steps" role="tabpanel"></div>
    <div class="panel" id="panel-history" role="tabpanel">
      <div class="tape-head"><span class="counter" id="tallyBox"><span aria-hidden="true">Nº</span><span class="wheels" id="tally"></span></span><span>answers saved, ever</span></div>
      <div id="histBody"></div>
    </div>
    <div class="panel" id="panel-graph" role="tabpanel">
      <div class="graph-head">
        <div class="graph-fns" id="graphFns"></div>
        <div class="graph-btns">
          <button type="button" class="btn" data-g="out" aria-label="Zoom out">−</button>
          <button type="button" class="btn" data-g="in" aria-label="Zoom in">+</button>
          <button type="button" class="btn" data-g="fit">Fit</button>
        </div>
      </div>
      <div class="graph-wrap"><canvas id="graphCanvas" aria-label="Graph"></canvas><div class="graph-empty" id="graphEmpty"></div></div>
      <div class="graph-pts" id="graphPts"></div>
      <p class="msg" id="graphHelp"></p>
    </div>
    <div class="panel" id="panel-trig" role="tabpanel"></div>
    <div class="panel" id="panel-keys" role="tabpanel"></div>
  </aside>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
'use strict';

// ===== Math core =====
// Exact rational arithmetic (BigInt), a parser for the editor's tree, and the step engine.

class CalcError extends Error {}

const MINUS = '−';
const OPS = { '+': '+', '-': MINUS, '*': '×', '/': '÷' };
const VERB = { '+': 'Add', '-': 'Subtract', '*': 'Multiply', '/': 'Divide' };
const PREC = { '+': 1, '-': 1, '*': 2, '/': 2 };

const abs = x => (x < 0n ? -x : x);
function gcd(a, b) { a = abs(a); b = abs(b); while (b) [a, b] = [b, a % b]; return a; }
const lcm = (a, b) => a / gcd(a, b) * b;

// Reduced rational with positive denominator.
function Q(n, d = 1n) {
  if (d === 0n) throw new CalcError('You can’t divide by zero.');
  if (d < 0n) { n = -n; d = -d; }
  const g = gcd(n, d) || 1n;
  return { n: n / g, d: d / g };
}
const ARITH = {
  '+': (a, b) => Q(a.n * b.d + b.n * a.d, a.d * b.d),

const enV = v => (!v ? null : isCx(v) ? { re: enV(v.re), im: enV(v.im) } : isPoly(v) ? { px: v.px.map(m => ({ k: m.k, c: enV(m.c) })), holes: holesOf(v).map(enV) }

  : isSurd(v) ? { c: enV(v.c), r: String(v.r), k: String(v.k) } : { n: String(v.n), d: String(v.d) });

function load() {
  const s = store.get();
  if (VIEWS.includes(s.view)) S.view = s.view;
  if (s.angle === 'rad') S.angle = 'rad';
  S.hints = s.hints !== false;
  S.autoExit = s.autoExit !== false;
  if (['steps', 'history', 'graph', 'trig', 'keys'].includes(s.tab)) S.tab = s.tab;
  if (Array.isArray(s.pins)) S.pins = s.pins.filter(p => p && validItems(p.items)).slice(-5);
  S.fx = s.fx === true;
  for (const id in A) {
    const ks = s.keys && s.keys[id];
    S.keys[id] = Array.isArray(ks) ? ks.filter(k => typeof k === 'string' && k) : null;
  }
  // v1 had root on T, which is now tangent.
  if (!s.keymapVersion && S.keys.root && S.keys.root.length === 1 && S.keys.root[0] === 't') S.keys.root = ['r'];
  // v2 saved with Enter; Enter now moves to the next box and Q saves.
  if ((s.keymapVersion || 1) < 3 && S.keys.eq && S.keys.eq.includes('Enter')) {
    S.keys.eq = S.keys.eq.filter(k => k !== 'Enter');
    if (!keyOwner('q')) S.keys.eq.unshift('q');

  for (const id in A) if (S.keys[id]) S.keys[id] = S.keys[id].map(k => (k === ' ' ? 'Space' : k));
  // v9 gave = its own key (equals), so it comes off save.
  if ((s.keymapVersion || 1) < 9 && S.keys.eq) S.keys.eq = S.keys.eq.filter(k => k !== '=');
  // Actions added since the keys were saved get their defaults, unless the key is already taken.
  for (const id in A) if (!S.keys[id]) S.keys[id] = DEFAULT_KEYS[id].filter(k => !keyOwner(k));

  if ((s.keymapVersion || 1) < 6) {
    for (const id of ['add', 'mul', 'frac']) S.keys[id] = S.keys[id].filter(k => !['- =', '- 8', '- 0'].includes(k));
    for (const [id, k] of [['add', '[ ='], ['mul', '[ 8'], ['frac', '[ 0']]) if (!keyOwner(k)) S.keys[id].push(k);

  if ((s.keymapVersion || 1) < 8 && !keyOwner('[ /')) S.keys.frac.push('[ /');

  if ((s.keymapVersion || 1) < 10 && S.keys.eq) S.keys.eq = S.keys.eq.filter(k => k !== '= =');

  if (S.page === 'system') S.root = S.sysRows[0];
}

// ---------- rendering ----------
const CUR = '<span class="cur"></span>';
let ARR_REG = [];

function opItem(it, prev) {
  const unary = (it.v === '-' || it.v === '+') && (!prev || (prev.t === 'c' && '+-*/('.includes(prev.v)));
  return { cls: 'ch op' + (unary ? ' un' : ''), txt: OPS[it.v] };
}

// Renders editor items. live = with cursor and click targets; otherwise a static copy (history).
function edArr(arr, path, isRoot, live) {
  const id = live ? ARR_REG.push(path) - 1 : 0;
  const here = live && samePath(path, S.cur.path);
  const at = i => (live ? ` data-a="${id}" data-i="${i}"` : '');
  if (!arr.length && !isRoot) {
    return `<span class="slot empty${here ? ' on' : ''}"${at(0)}>${here ? CUR : ''}</span>`;
  }
  let s = '', depth = 0;
  arr.forEach((it, i) => {
    if (here && S.cur.i === i) s += CUR;
    if (it.t === 'c') {
      if ('+-*/'.includes(it.v)) {
        const o = opItem(it, arr[i - 1]);
        s += `<span class="${o.cls}"${at(i)}>${o.txt}</span>`;
      } else s += `<span class="ch${it.v === '=' ? ' eqch' : ''}"${at(i)}>${it.v}</span>`;
      if (it.v === '(') depth++;
      else if (it.v === ')' && depth > 0) depth--;
    } else if (it.t === 'ans') {
      s += `<span class="ch ans"${at(i)}>Ans</span>`;
    } else if (it.t === 'pi') {
      s += `<span class="ch"${at(i)}>π</span>`;
    } else if (['x', 'y', 'v', 'e', 'i'].includes(it.t)) {
      s += `<span class="ch xv"${at(i)}>${it.t === 'v' ? it.v : it.t}</span>`;
    } else if (it.t === 'log') { // the base box only shows once it's used (or the cursor is in it)
      const bPath = [...path, { idx: i, slot: 'lb' }];
      const showB = it.lb.length || (live && samePath(S.cur.path.slice(0, bPath.length), bPath));
      s += `<span class="fnw"${at(i)}><span class="fnn">log</span>${showB ? `<span class="sub">${edArr(it.lb, bPath, false, live)}</span>` : ''}(${edArr(it.la, [...path, { idx: i, slot: 'la' }], false, live)})</span>`;
    } else if (it.t === 'fn') {
      const pwPath = [...path, { idx: i, slot: 'pw' }];
      const showPw = it.pw.length || (live && samePath(S.cur.path.slice(0, pwPath.length), pwPath));
      const pw = showPw ? `<span class="sup">${edArr(it.pw, pwPath, false, live)}</span>` : '';
      s += `<span class="fnw"${at(i)}><span class="fnn">${FN_LABEL[it.name]}</span>${pw}(${edArr(it.arg, [...path, { idx: i, slot: 'arg' }], false, live)})</span>`;
    } else {
      const sub = slot => edArr(it[slot], [...path, { idx: i, slot }], false, live);
      if (it.t === 'pow') {
        s += `<span class="sup"${at(i)}>${sub('exp')}</span>`;
      } else if (it.t === 'rep') {
        s += `<span class="repw"${at(i)}>${sub('rep')}</span>`;
      } else if (it.t === 'root') {
        // The index box only shows once it's used (or the cursor is in it).
        const idxPath = [...path, { idx: i, slot: 'idx' }];
        const showIdx = it.idx.length || (live && samePath(S.cur.path.slice(0, idxPath.length), idxPath));
        s += rootHTML(sub('rad'), showIdx ? sub('idx') : null).replace('<span class="rt"', `<span class="rt"${at(i)}`);
      } else {
        const f = `<span class="fr"><span class="fr-n">${sub('num')}</span><span class="fr-d">${sub('den')}</span></span>`;
        s += it.t === 'frac'
          ? f.replace('<span class="fr"', `<span class="fr"${at(i)}`)
          : `<span class="mx"${at(i)}>${sub('whole')}<span class="mx-gap"></span>${f}</span>`;
      }
    }
  });
  if (here && S.cur.i === arr.length) s += CUR;
  s += '<span class="ghost">)</span>'.repeat(depth);
  return isRoot ? s : `<span class="slot">${s}</span>`;
}

const SYS_PH = ['y = 2x + 3, or 2x + 3y = 6…', 'y = x² − 1, or leave it empty'];

      ? edArr(S.root, [], true, true)

});

document.querySelector('.tabs').addEventListener('click', e => {
  const t = e.target.closest('[data-tab]');
  if (!t) return;
  S.tab = t.dataset.tab;
  S.capture = null;
  save();
  render();
});

$('#panel-history').addEventListener('click', e => {
  if (e.target.closest('[data-clear-history]')) { S.history = []; save(); render(); return; }
  const b = e.target.closest('[data-hist]');
  if (!b) return;
  S.root = structuredClone(S.history[+b.dataset.hist].items);
  S.cur = { path: [], i: S.root.length };
  edited();
  render();
});

$('#panel-trig').addEventListener('click', e => {
  const b = e.target.closest('[data-try]');
  if (!b) return;
  const [g, r] = b.dataset.try.split('.').map(Number);
  setPage('simplify');
  S.root = itemsOf(TRIG_REF[g][1][r]);
  S.cur = { path: [], i: S.root.length };
  S.tab = 'steps';
  render();
});

$('#panel-keys').addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-add]')) { S.capture = t.closest('[data-add]').dataset.add; S.capKeys = []; render(); return; }
  if (t.closest('[data-cancel]')) { clearTimeout(capTimer); S.capture = null; S.capKeys = []; render(); return; }
  const rm = t.closest('[data-rm]');
  if (rm) { S.keys[rm.dataset.rm] = S.keys[rm.dataset.rm].filter(k => k !== rm.dataset.key); save(); render(); return; }
  if (t.closest('[data-reset-keys]')) {
    for (const id in A) S.keys[id] = [...DEFAULT_KEYS[id]];
    S.capture = null;
    save();
    toast('Keybinds reset to defaults');
    render();
  }
});
$('#panel-keys').addEventListener('change', e => {
  if (e.target.id === 'hintsToggle') { S.hints = e.target.checked; save(); render(); }
  if (e.target.id === 'autoExitToggle') { S.autoExit = e.target.checked; save(); render(); }
});

load();
render();
</script>
</body>
</html>
